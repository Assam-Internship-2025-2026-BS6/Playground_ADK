name: playground
description: "Design Kit Playground"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  designkit:
    path: ../designkit_hdfc_web/designkit

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/hdfc_logo.png
    - assets/now_logo.png
    - assets/lock.png
    - assets/left_image.png
    - assets/right_back.png
